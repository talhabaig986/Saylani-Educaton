<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
    }

    header{
        background-color: darkcyan;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 10vh;
        padding: 18px 25px;
        font-size: 17px;
    }

    .logo{
        display: flex;
        align-items: center;
        gap: 10px;
    }

    nav ul{
        display: flex;
        gap: 40px;
        list-style-type: none;
    }

    li a{
        text-decoration: none;
        color: white;
    }

    main{
        margin: 0;
        padding: 0;
    }

    .slider-section{
        height: 90vh;
        overflow: hidden;
    }

    .gallery-section{
        padding: 45px 30px;
        background-color: floralwhite;
    }

    .gallery-section h1{
        text-align: center;
        color: darkcyan;
        font-size: 36px;
        margin-bottom: 30px;
        text-decoration: underline;
    }

    .gallery{
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .gallery-img{
        width: 23%;
        background-color: white;
        padding: 10px;
        border-radius: 10px;
    }

    .gallery-img img{
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
    }

    .gallery-img p{
        text-align: center;
        color: darkcyan;
        font-size: 15px;
        font-weight: bold;
        margin-top: 8px;
    }

    footer{
        min-height: 25vh;
        background-color: darkcyan;
        color: white;
    }

    footer p{
        text-align: center;
        font-size: 15px;
        padding-top: 60px;
    }
</style>
</head>

    <header>
